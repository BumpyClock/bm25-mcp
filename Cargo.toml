[package]
name = "bm25-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Local project and coding-agent session BM25 search over MCP"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
sha2 = "0.10"
unicode-casefold = "0.2"
ignore = "0.4"
globset = "0.4"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.9"
rmcp = { version = "1.8", features = ["server", "transport-io"] }
schemars = "1"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
bm25_turbo = { path = "vendor/bm25_turbo", default-features = false }
tempfile = "3"
